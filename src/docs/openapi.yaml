        proveedor:
          type: [string, 'null']
          maxLength: 191
        fechaCompra:
          type: [string, 'null']
          format: date
        fechaVencimiento:
          type: string
          format: date
        asignadaAId:
          type: [string, 'null']
        activa:
          type: boolean

