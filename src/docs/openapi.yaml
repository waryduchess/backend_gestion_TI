    LicenciaResumen:
      type: object
      required:
        - id
        - software
        - tieneClave
        - proveedor
        - fechaCompra
        - fechaVencimiento
        - activa
        - asignadaA
      properties:
        id:
          type: integer
          example: 1
        software:
          type: string
          example: Microsoft 365
        tieneClave:
          type: boolean
          description: Indica si existe una clave cifrada, sin exponerla.
          example: true
        proveedor:
          type: [string, 'null']
          example: Microsoft
        fechaCompra:
          type: [string, 'null']
          format: date-time
        fechaVencimiento:
          type: string
          format: date-time
        activa:
          type: boolean
          example: true
        asignadaA:
          oneOf:
            - $ref: '#/components/schemas/UsuarioAuth'
            - type: 'null'

    LicenciaRequest:
      type: object
