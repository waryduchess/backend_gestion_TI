      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: CT003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioEdicion'
            example:
              nombre: Carmen T. Ruiz
              puestoId: null
      responses:
        '200':
          description: Usuario actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaUsuario'
        '400':
          description: Sin campos editables, campo invalido o password en el body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              examples:
                sinCampos:
                  summary: Body sin campos
                  value:
                    success: false
                    message: No se recibio ningun campo para actualizar
                    errors: []
                passwordEnBody:
                  summary: password en PATCH /:id
                  value:
                    success: false
                    message: 'El campo "password" no se puede editar aqui; use PATCH /api/usuarios/:id/password'
                    errors:
                      - campo: password
                        valor: null
        '404':
          description: No existe un usuario con ese id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Token ausente, invalido o expirado
        '403':
          description: Requiere el permiso usuarios:administrar
    delete:
      tags: [usuarios]
      summary: Dar de baja un usuario (borrado logico)
      description: >
        Nunca borra la fila: marca activo=false. Idempotente: si ya estaba
        inactivo responde 200 sin cambios. Requiere el permiso
        usuarios:administrar.
      operationId: eliminarUsuario
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: ZZT01
      responses:
        '200':
          description: Usuario dado de baja correctamente (o ya estaba)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaUsuario'
              example:
                success: true
                message: Usuario dado de baja correctamente
                errors: []
                data:
                  id: ZZT01
                  nombre: Usuario De Prueba
                  email: null
                  activo: false
                  fechaInicio: null
                  fechaFin: null
                  departamento: null
                  ubicacion: null
                  puesto: null
                  tipoUsuario: null
                  rol: null
        '400':
          description: id vacio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':
          description: No existe un usuario con ese id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Token ausente, invalido o expirado
        '403':
          description: Requiere el permiso usuarios:administrar

  /api/usuarios/{id}/rol:
    patch:
      tags: [usuarios]
      summary: Asignar o quitar el rol de un usuario
      operationId: asignarRolUsuario
      description: Requiere permiso roles:administrar. Enviar rolId null para quitar el rol.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: CT003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignarRolUsuario'
            example:
              rolId: 2
      responses:
        '200':
          description: Rol asignado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaUsuario'
        '400':
          description: rolId invalido o rol inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Token ausente, invalido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: Requiere el permiso roles:administrar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /api/usuarios/{id}/password:
    patch:
      tags: [usuarios]
      summary: Asignar o rotar el password de un usuario
      description: Requiere el permiso usuarios:administrar.
      operationId: cambiarPasswordUsuario
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: CT003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordEdicion'
            example:
              password: NuevaClave123
      responses:
        '200':
          description: Password actualizado correctamente (nunca se devuelve el hash)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaUsuario'
        '400':
          description: password vacio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: Faltan campos obligatorios
                errors:
                  - campo: password
                    valor: ''
                    mensaje: El password es obligatorio
        '404':
          description: No existe un usuario con ese id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Token ausente, invalido o expirado
        '403':
          description: Requiere el permiso usuarios:administrar

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token devuelto por POST /api/auth/login. Enviar como
        Authorization: Bearer <token>

  parameters:
    CatalogoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1.

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@horbismex.com
        password:
          type: string
          format: password
          example: "********"

    UsuarioAuth:
      type: object
      required: [id, nombre, email]
      properties:
        id:
          type: string
          example: ADMIN
        nombre:
          type: string
          example: Administrador
        email:
          type: [string, 'null']
          example: admin@horbismex.com

    UsuarioPerfil:
      allOf:
        - $ref: '#/components/schemas/UsuarioAuth'
        - type: object
          required: [activo, rol]
          properties:
            activo:
              type: boolean
              example: true
            rol:
              type: [string, 'null']
              description: Nombre del rol RBAC; null mientras no se configuren roles
              example: null

    UsuarioResumen:
      type: object
      required: [id, nombre, email]
      properties:
        id:
          type: string
          example: A010
        nombre:
          type: string
          example: Lauriano Antonio Cruz Durante
        email:
          type: [string, 'null']
          example: antonio.cruz@horbismex.com

    DepartamentoResumen:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: ADMINISTRACION

    RespuestaLogin:
      type: object
      required: [success, message, errors, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Sesion iniciada correctamente
        errors:
          type: array
          items: {}
          example: []
        data:
          type: object
          required: [token, tokenTipo, expiraEn, usuario]
          properties:
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            tokenTipo:
              type: string
              enum: [Bearer]
            expiraEn:
              type: string
              example: 8h
            usuario:
              $ref: '#/components/schemas/UsuarioAuth'

    RespuestaPerfil:
      type: object
      required: [success, message, errors, data]
      properties:
        success:
          type: boolean
        message:
          type: string
        errors:
          type: array
          items: {}
        data:
          $ref: '#/components/schemas/UsuarioPerfil'

    RespuestaError:
      type: object
      required: [success, message, errors]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Credenciales invalidas
        errors:
          type: array
          items:
            oneOf:
              - type: string
              - $ref: '#/components/schemas/ErrorCampo'

    ErrorCampo:
      type: object
      description: Detalle de un campo que causo el error de validacion
      properties:
        campo:
          type: string
          example: estado
        valor:
          type: [string, number, 'null']
          example: BOGUS
        mensaje:
          type: string
          example: El email es obligatorio
        permitidos:
          type: array
          items:
            type: string
          description: Presente cuando el valor debe pertenecer a un enum

    MetaPaginacion:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 214
        totalPages:
          type: integer
          example: 22

    EstadoIncidencia:
      type: string
      enum: [NUEVO, EN_ANALISIS, EN_CURSO, COMPLETADO, DUPLICADO]
      example: NUEVO

    Prioridad:
      type: string
      enum: [BAJA, NORMAL, ALTA, CRITICA]
      example: NORMAL

    TipoRequerimiento:
      type: string
      enum:
        - NETSUITE
        - OTROS
        - OFFICE
        - EMAIL
        - IMPRESION
        - ERROR_EN_EQUIPO
        - SOLICITUD_DE_EQUIPO
        - INTRANET
        - CONEXION_DE_RED
      example: CONEXION_DE_RED

    EstadoActivo:
      type: string
      enum: [EN_USO, EN_ALMACEN, EN_MANTENIMIENTO, DE_BAJA]
      example: EN_USO

    Incidencia:
      type: object
      required:
        - id
        - originalId
        - titulo
        - estado
        - prioridad
        - tipoRequerimiento
        - fechaNotificacion
        - fechaResolucion
        - solicitante
        - asignadoA
        - departamento
        - totalActualizaciones
      properties:
        id:
          type: integer
          example: 1
        originalId:
          type: [integer, 'null']
          description: Id original de SharePoint (reimportacion / desduplicado)
        titulo:
          type: string
          maxLength: 500
          example: Falla de conexion a la red
        estado:
          $ref: '#/components/schemas/EstadoIncidencia'
        prioridad:
          $ref: '#/components/schemas/Prioridad'
        tipoRequerimiento:
          $ref: '#/components/schemas/TipoRequerimiento'
        fechaNotificacion:
          type: string
          format: date-time
          example: '2026-09-28T15:00:00.000Z'
        fechaResolucion:
          type: [string, 'null']
          format: date-time
        solicitante:
          $ref: '#/components/schemas/UsuarioResumen'
        asignadoA:
          oneOf:
            - $ref: '#/components/schemas/UsuarioResumen'
            - type: 'null'
        departamento:
          oneOf:
            - $ref: '#/components/schemas/DepartamentoResumen'
            - type: 'null'
        totalActualizaciones:
          type: integer
          description: Numero de actualizaciones del ticket
          example: 0

    ActualizacionIncidencia:
      type: object
      required: [id, texto, creadaEn]
      properties:
        id:
          type: integer
          example: 1
        texto:
          type: string
          example: Se recibio el reporte.
        creadaEn:
          type: string
          format: date-time

    IncidenciaDetalle:
      allOf:
        - $ref: '#/components/schemas/Incidencia'
        - type: object
          required: [descripcion, evidenciaUrl, actualizaciones]
          properties:
            descripcion:
              type: string
              example: El equipo no logra conectarse a la red inalambrica.
            evidenciaUrl:
              type: [string, 'null']
              format: uri
            actualizaciones:
              type: array
              description: Historial en orden cronologico ascendente
              items:
                $ref: '#/components/schemas/ActualizacionIncidencia'

    DatosCreacionIncidencia:
      type: object
      additionalProperties: false
      required: [titulo, descripcion, tipoRequerimiento]
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 500
          example: Falla de conexion a la red
        descripcion:
          type: string
          minLength: 1
          example: El equipo no logra conectarse a la red inalambrica.
        tipoRequerimiento:
          $ref: '#/components/schemas/TipoRequerimiento'
        departamentoId:
          type: [integer, 'null']
          minimum: 1
          description: Opcional; debe referenciar un departamento activo
          example: 1

    RespuestaIncidencia:
      type: object
      required: [success, message, errors, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Incidencia creada correctamente
        errors:
          type: array
          items: {}
        data:
          $ref: '#/components/schemas/Incidencia'

    RespuestaIncidenciaDetalle:
      type: object
      required: [success, message, errors, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Incidencia obtenida correctamente
        errors:
          type: array
          items: {}
        data:
          $ref: '#/components/schemas/IncidenciaDetalle'

    Notificacion:
      type: object
      required: [id, incidenciaId, creadaEn, leidaEn, leida, incidencia]
      properties:
        id:
          type: integer
        incidenciaId:
          type: integer
        creadaEn:
          type: string
          format: date-time
        leidaEn:
          type: [string, 'null']
          format: date-time
        leida:
          type: boolean
        incidencia:
          type: object
          required: [id, titulo, estado, prioridad, fechaNotificacion]
          properties:
            id:
              type: integer
            titulo:
              type: string
            estado:
              $ref: '#/components/schemas/EstadoIncidencia'
            prioridad:
              $ref: '#/components/schemas/Prioridad'
            fechaNotificacion:
              type: string
              format: date-time

    MetaNotificaciones:
      type: object
      required: [page, limit, total, totalPages, noLeidas]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        noLeidas:
          type: integer
          description: Total no leido del usuario, independiente del filtro leida

    RespuestaNotificacionesPaginada:
      type: object
      required: [success, message, errors, data, meta]
      properties:
        success:
          type: boolean
        message:
          type: string
        errors:
          type: array
          items: {}
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notificacion'
        meta:
          $ref: '#/components/schemas/MetaNotificaciones'

    RespuestaNotificacion:
      type: object
      required: [success, message, errors, data]
      properties:
        success:
          type: boolean
        message:
          type: string
        errors:
          type: array
          items: {}
        data:
          $ref: '#/components/schemas/Notificacion'

    RespuestaMarcarTodasNotificacionesLeidas:
      type: object
      required: [success, message, errors, data]
      properties:
        success:
          type: boolean
        message:
          type: string
        errors:
          type: array
          items: {}
        data:
          type: object
          required: [marcadasComoLeidas]
          properties:
            marcadasComoLeidas:
              type: integer

    RespuestaIncidenciasPaginada:
      type: object
      required: [success, message, errors, data, meta]
      properties:
        success:
          type: boolean
        message:
          type: string
          example: Incidencias obtenidas correctamente
        errors:
          type: array
          items: {}
        data:
          type: array
          items:
            $ref: '#/components/schemas/Incidencia'
        meta:
          $ref: '#/components/schemas/MetaPaginacion'

    Activo:
      type: object
      required:
        - id
        - claveActivo
        - cb23
        - tipo
        - marca
        - modelo
        - numeroSerie
        - sucursal
        - estado
        - estadoGeneral
        - nombreRed
        - responsable
      properties:
        id:
          type: integer
          example: 439
        claveActivo:
          type: [string, 'null']
          description: 'Clave AF del inventario (ej: AF00010); nula para los activos cargados por CODIGO'
          example: AF00010
        cb23:
          type: [string, 'null']
          description: Codigo interno CB23 / CODIGO
          example: '100003'
        tipo:
          type: string
          description: Laptop, Desktop, Monitor...; SIN_DATO cuando el Excel no trae tipo
          example: Laptop
        marca:
          type: [string, 'null']
          example: Dell
        modelo:
          type: [string, 'null']
          example: Inspiron 15
        numeroSerie:
          type: [string, 'null']
          example: CXBF1Z3
        sucursal:
          type: [string, 'null']
          example: CANCUN
        estado:
          $ref: '#/components/schemas/EstadoActivo'
        estadoGeneral:
          type: [string, 'null']
          description: Condicion fisica original del Excel (Bien, Regular, NI...)
          example: Bien
        nombreRed:
          type: [string, 'null']
          example: D16 COMPRAS
        responsable:
          oneOf:
            - $ref: '#/components/schemas/UsuarioResumen'
            - type: 'null'
          description: Null cuando no hay match unico con un usuario del catalogo

    ActivoDetalle:
      allOf:
        - $ref: '#/components/schemas/Activo'
        - type: object
          required: [numeroParte, anydesk, procesador, memoria, notas, asignaciones]
          properties:
            numeroParte:
              type: [string, 'null']
            anydesk:
              type: [string, 'null']
            procesador:
              type: [string, 'null']
              example: i5-1133g7
            memoria:
              type: [string, 'null']
              example: 8GB
            notas:
              type: [string, 'null']
            asignaciones:
              type: array
              description: Solo asignaciones activas
              items:
                type: object
                required: [id, activa, fechaAsignacion, usuario]
                properties:
                  id:
                    type: integer
                    example: 3
                  activa:
                    type: boolean
                    example: true
                  fechaAsignacion:
                    type: string
                    format: date-time
                  usuario:
                    $ref: '#/components/schemas/UsuarioResumen'

    ActivoCreacion:
      type: object
      required: [tipo]
      description: Cuerpo de POST /api/activos; los campos opcionales van en null o se omiten
      properties:
        tipo:
          type: string
          description: Obligatorio (Laptop, Desktop, Monitor, Switch...)
          example: Laptop
        claveActivo:
          type: [string, 'null']
          description: Debe ser unica; si ya existe responde 409
          example: AF00100
        cb23:
          type: [string, 'null']
        marca:
          type: [string, 'null']
          example: Lenovo
        modelo:
          type: [string, 'null']
          example: ThinkPad E14
        numeroParte:
          type: [string, 'null']
        numeroSerie:
          type: [string, 'null']
          example: PF2XYZ99
        sucursal:
          type: [string, 'null']
          example: CANCUN
        anydesk:
          type: [string, 'null']
        nombreRed:
          type: [string, 'null']
        procesador:
          type: [string, 'null']
        memoria:
          type: [string, 'null']
        estadoGeneral:
          type: [string, 'null']
          description: Condicion fisica original (Bien, Regular...)
        notas:
          type: [string, 'null']
        estado:
          $ref: '#/components/schemas/EstadoActivo'
        responsableId:
          type: string
          description: Id de un usuario existente; si no existe responde 400
          example: A010

    ActivoEdicion:
      type: object
      description: >
        Body de PATCH /api/activos/{id}: solo los campos presentes se modifican;
        null o cadena vacia borra el valor. No incluir "estado".
      properties:
        tipo:
          type: string
          description: No admite vacio (400); si se omite no se modifica
          example: Laptop
        claveActivo:
          type: [string, 'null']
          description: Debe ser unica entre activos; null la borra
          example: AF00101
        cb23:
          type: [string, 'null']
        marca:
          type: [string, 'null']
          example: Lenovo
        modelo:
          type: [string, 'null']
          example: ThinkPad E15
        numeroParte:
          type: [string, 'null']
        numeroSerie:
          type: [string, 'null']
          example: PF2XYZ99
        sucursal:
          type: [string, 'null']
          example: CANCUN
        anydesk:
          type: [string, 'null']
        nombreRed:
          type: [string, 'null']
        procesador:
          type: [string, 'null']
        memoria:
          type: [string, 'null']
        estadoGeneral:
          type: [string, 'null']
        notas:
          type: [string, 'null']
        responsableId:
          type: [string, 'null']
          description: Usuario existente; null o cadena vacia libera el responsable
          example: A010

    CambioEstadoActivo:
      type: object
      required: [estado]
      properties:
        estado:
          allOf:
            - $ref: '#/components/schemas/EstadoActivo'
          description: Obligatorio; cualquier transicion entre los 4 estados

    AsignacionActivoCreacion:
      type: object
      required: [usuarioId]
      properties:
        usuarioId:
          type: string
          description: Obligatorio; debe existir en el catalogo de usuarios
          example: A010
        anioCompra:
          type: [integer, 'null']
          minimum: 0
          example: 2024
        numeroActivo:
          type: [string, 'null']
        nombreEquipo:
          type: [string, 'null']
          description: Hostname del equipo
          example: PC-CANCUN-01
        bitlocker:
          type: [string, 'null']
          description: Clave de recuperacion (hoy en claro; candidata a cifrado AES-256-GCM)
        observacion:
          type: [string, 'null']
          example: Entrega inicial

    RespuestaActivosPaginada:
      type: object
      required: [success, message, errors, data, meta]
      properties:
        success:
          type: boolean
        message:
          type: string
          example: Activos obtenidos correctamente
        errors:
          type: array
          items: {}
        data:
          type: array
          items:
            $ref: '#/components/schemas/Activo'
        meta:
          $ref: '#/components/schemas/MetaPaginacion'

    Usuario:
      type: object
      description: Usuario del sistema. Nunca incluye passwordHash.
      required: [id, nombre, activo]
      properties:
        id:
          type: string
          description: Clave interna del excel
          example: CT003
        nombre:
          type: string
          example: Carmen Torres Ruiz
        email:
          type: string
          nullable: true
          description: Sin unique (hay correos compartidos)
        activo:
          type: boolean
          description: false = baja logica
        fechaInicio:
          type: string
          format: date-time
          nullable: true
        fechaFin:
          type: string
          format: date-time
          nullable: true
        departamento:
          $ref: '#/components/schemas/CatalogoResumen'
        ubicacion:
          $ref: '#/components/schemas/CatalogoResumen'
        puesto:
          $ref: '#/components/schemas/CatalogoResumen'
        tipoUsuario:
          $ref: '#/components/schemas/CatalogoResumen'
        rol:
          $ref: '#/components/schemas/RolResumen'

    CatalogoResumen:
      type: object
      nullable: true
      required: [id, nombre]
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Administracion

    Rol:
      type: object
      required: [id, nombre, permisos, activo]
      properties:
        id:
          type: integer
          example: 2
        nombre:
          type: string
          example: Soporte
        permisos:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permiso'
        activo:
          type: boolean
          example: true

    Permiso:
      type: string
      enum:
        - incidencias:leer
        - activos:leer
        - activos:crear
        - activos:editar
        - activos:estado
        - activos:asignar
        - activos:eliminar
        - usuarios:administrar
        - roles:administrar
        - catalogos:administrar
        - licencias:administrar

    RolCreacion:
      type: object
      required: [nombre, permisos]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 191
        permisos:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permiso'

    RolEdicion:
      type: object
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 191
        permisos:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permiso'
        activo:
          type: boolean
          enum: [true]
          description: Use true para reactivar un rol previamente desactivado.

    RespuestaRol:
      type: object
      required: [success, message, errors, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        errors:
          type: array
          items: {}
        data:
          $ref: '#/components/schemas/Rol'

    RespuestaRoles:
      type: object
      required: [success, message, errors, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        errors:
          type: array
          items: {}
        data:
          type: array
          items:
            $ref: '#/components/schemas/Rol'

    RolResumen:
      type: object
