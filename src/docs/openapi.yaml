          type: [string, 'null']
          description: Se almacena cifrada con AES-256-GCM y nunca se devuelve.
        proveedor:
          type: [string, 'null']
          maxLength: 191
        fechaCompra:
          type: [string, 'null']
          format: date
        fechaVencimiento:
          type: string
          format: date
        asignadaAId:
          type: [string, 'null']

