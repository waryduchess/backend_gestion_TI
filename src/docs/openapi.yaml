openapi: 3.1.0
info:
  title: Sistema de Gestion TI - API
  version: 1.0.0
  description: >
    API REST del Sistema de Gestion de TI (tickets, inventario, licencias,
    proyectos, reportes). Todas las respuestas usan el mismo envoltorio
    { success, message, errors, data, meta } y los errores HTTP devuelven
    success=false con el detalle en errors.
  contact:
    name: Equipo de TI
servers:
  - url: http://localhost:3000
    description: Entorno local (Docker)
tags:
  - name: auth
    description: Autenticacion JWT (login y perfil)
  - name: incidencias
    description: Consulta y creacion de tickets / incidencias
  - name: notificaciones
    description: Historial persistente de notificaciones del usuario autenticado
  - name: activos
    description: Inventario de activos de computo
  - name: asignaciones
    description: Entrega y devolucion de equipos
  - name: usuarios
    description: Usuarios del sistema y sus datos
  - name: catalogos
    description: >
      Catalogos para usuarios y relaciones del sistema. GET /api/catalogos
      requiere JWT; sus CRUD requieren ademas catalogos:administrar.
  - name: licencias
    description: Licencias protegidas por el permiso licencias:administrar
  - name: roles
    description: Roles y permisos de acceso

paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: Iniciar sesion
      description: >
        Valida las credenciales contra la base de datos y devuelve un token
        JWT con expiracion configurada (8h por defecto).
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@horbismex.com
              password: "********"
      responses:
        '200':
          description: Sesion iniciada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLogin'
              example:
                success: true
                message: Sesion iniciada correctamente
                errors: []
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  tokenTipo: Bearer
                  expiraEn: 8h
                  usuario:
                    id: ADMIN
                    nombre: Administrador
                    email: admin@horbismex.com
        '400':
          description: Faltan campos obligatorios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: Faltan campos obligatorios
                errors:
                  - campo: email
                    valor: ''
                    mensaje: El email es obligatorio
        '401':
          description: Credenciales invalidas (email o password incorrectos, o usuario inactivo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: Credenciales invalidas
                errors: []

  /api/auth/me:
    get:
      tags: [auth]
      summary: Obtener el perfil del usuario autenticado
      operationId: obtenerPerfil
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario del token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaPerfil'
              example:
                success: true
                message: Perfil obtenido correctamente
                errors: []
                data:
                  id: ADMIN
                  nombre: Administrador
                  email: admin@horbismex.com
                  activo: true
                  rol: null
        '401':
          description: Token ausente, invalido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: Autenticacion requerida
                errors: []
        '403':
          description: El usuario existe pero esta inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: El usuario esta inactivo
                errors: []

  /api/incidencias:
    post:
      tags: [incidencias]
      summary: Crear una incidencia
      description: >
        Requiere el permiso incidencias:crear. El solicitante se obtiene del
        JWT. El estado inicia en NUEVO y la prioridad en NORMAL; la fecha de
        notificacion la establece el servidor. Al guardar, se crean
        notificaciones persistentes para usuarios con incidencias:leer y se
        emite incidencias:nueva por Socket.IO con el notificacionId destinado
        a cada usuario.
      operationId: crearIncidencia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosCreacionIncidencia'
            example:
              titulo: Falla de conexion a la red
              descripcion: El equipo no logra conectarse a la red inalambrica.
              tipoRequerimiento: CONEXION_DE_RED
              departamentoId: 1
      responses:
        '201':
          description: Incidencia creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaIncidencia'
              example:
                success: true
                message: Incidencia creada correctamente
                errors: []
                data:
                  id: 24
                  originalId: null
                  titulo: Falla de conexion a la red
                  estado: NUEVO
                  prioridad: NORMAL
                  tipoRequerimiento: CONEXION_DE_RED
                  fechaNotificacion: '2026-10-05T16:00:00.000Z'
                  fechaResolucion: null
                  solicitante:
                    id: ADMIN
                    nombre: Administrador
                    email: admin@example.com
                  asignadoA: null
                  departamento:
                    id: 1
                    nombre: Sistemas
                  totalActualizaciones: 0
        '400':
          description: Cuerpo invalido, campos obligatorios ausentes o departamento inexistente/inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Token ausente, invalido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: El usuario no tiene permiso para crear incidencias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
    get:
      tags: [incidencias]
      summary: Listar incidencias (paginado)
      description: Requiere el permiso incidencias:leer.
      operationId: listarIncidencias
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Pagina a consultar (empezando en 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Elementos por pagina (entre 1 y 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: estado
          in: query
          required: false
          description: Filtra por estado de la incidencia
          schema:
            $ref: '#/components/schemas/EstadoIncidencia'
        - name: prioridad
          in: query
          required: false
          description: Filtra por prioridad
          schema:
            $ref: '#/components/schemas/Prioridad'
      responses:
        '200':
          description: Incidencias obtenidas correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaIncidenciasPaginada'
              example:
                success: true
                message: Incidencias obtenidas correctamente
                errors: []
                data:
                  - id: 1
                    originalId: null
                    titulo: Falla de conexion a la red
                    estado: NUEVO
                    prioridad: ALTA
                    tipoRequerimiento: CONEXION_DE_RED
                    fechaNotificacion: '2026-09-28T15:00:00.000Z'
                    fechaResolucion: null
                    solicitante:
                      id: A006
                      nombre: Angelica Maria Buendia Fierro
                      email: cxc.cancun@horbismex.com
                    asignadoA: null
                    departamento: null
                    totalActualizaciones: 0
                meta:
                  page: 1
                  limit: 10
                  total: 3
                  totalPages: 1
        '400':
          description: Parametro invalido (page no numerico, limit fuera de rango o enum desconocido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: El parametro "limit" debe estar entre 1 y 100
                errors:
                  - campo: limit
                    valor: '500'

  /api/incidencias/{id}:
    get:
      tags: [incidencias]
      summary: Obtener detalle de una incidencia
      description: Requiere el permiso incidencias:leer. Incluye descripcion e historial de actualizaciones en orden cronologico.
      operationId: obtenerIncidencia
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador entero positivo de la incidencia
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        '200':
          description: Incidencia obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaIncidenciaDetalle'
              example:
                success: true
                message: Incidencia obtenida correctamente
                errors: []
                data:
                  id: 1
                  originalId: null
                  titulo: Falla de conexion a la red
                  descripcion: El equipo no logra conectarse a la red inalambrica.
                  estado: NUEVO
                  prioridad: ALTA
                  tipoRequerimiento: CONEXION_DE_RED
                  fechaNotificacion: '2026-09-28T15:00:00.000Z'
                  fechaResolucion: null
                  evidenciaUrl: null
                  solicitante:
                    id: A006
                    nombre: Angelica Maria Buendia Fierro
                    email: cxc.cancun@horbismex.com
                  asignadoA: null
                  departamento: null
                  totalActualizaciones: 1
                  actualizaciones:
                    - id: 1
                      texto: Se recibio el reporte.
                      creadaEn: '2026-09-28T15:05:00.000Z'
        '400':
          description: El identificador no es un entero positivo seguro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: El parametro "id" debe ser un numero entero positivo
                errors:
                  - campo: id
                    valor: abc
        '401':
          description: Token ausente, invalido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: El usuario no tiene permiso para leer incidencias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':
          description: Incidencia no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: Incidencia no encontrada
                errors:
                  - campo: id
                    valor: 99999999

  /api/notificaciones:
    get:
      tags: [notificaciones]
      summary: Listar notificaciones propias
      description: >
        Requiere JWT e incidencias:leer. Solo devuelve notificaciones del
        usuario autenticado. meta.noLeidas siempre cuenta todas sus
        notificaciones pendientes, incluso cuando se filtra por leida.
      operationId: listarNotificaciones
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: leida
          in: query
          required: false
          description: Filtra notificaciones leidas o pendientes
          schema:
            type: boolean
      responses:
        '200':
          description: Notificaciones obtenidas correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaNotificacionesPaginada'
        '400':
          description: Parametros de paginacion o filtro invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Token ausente, invalido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: Se requiere el permiso incidencias:leer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /api/notificaciones/leer-todas:
    patch:
      tags: [notificaciones]
      summary: Marcar todas las notificaciones propias como leidas
      description: Requiere JWT e incidencias:leer. Solo actualiza registros del usuario autenticado.
      operationId: marcarTodasNotificacionesLeidas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notificaciones marcadas como leidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaMarcarTodasNotificacionesLeidas'
        '401':
          description: Token ausente, invalido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: Se requiere el permiso incidencias:leer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /api/notificaciones/{id}/leer:
    patch:
      tags: [notificaciones]
      summary: Marcar una notificacion propia como leida
      description: Requiere JWT e incidencias:leer. Un registro ajeno se trata como no encontrado.
      operationId: marcarNotificacionLeida
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Notificacion marcada como leida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaNotificacion'
        '400':
          description: Identificador invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Token ausente, invalido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: Se requiere el permiso incidencias:leer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':
          description: Notificacion inexistente o perteneciente a otro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /api/activos:
    get:
      tags: [activos]
      summary: Listar activos (paginado y filtrable)
      description: Requiere el permiso activos:leer.
      operationId: listarActivos
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Elementos por pagina (entre 1 y 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: tipo
          in: query
          required: false
          description: Tipo de activo exacto (Laptop, Desktop, Monitor...)
          schema:
            type: string
            example: Laptop
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoActivo'
        - name: sucursal
          in: query
          required: false
          description: Sucursal exacta (CANCUN, PLAYA...)
          schema:
            type: string
            example: CANCUN
        - name: responsableId
          in: query
          required: false
          description: Id del usuario responsable del activo
          schema:
            type: string
            example: A010
        - name: q
          in: query
          required: false
          description: Busqueda libre en claveActivo, cb23, numeroSerie, marca, modelo y nombreRed
          schema:
            type: string
            example: CXBF1Z3
      responses:
        '200':
          description: Activos obtenidos correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaActivosPaginada'
              example:
                success: true
                message: Activos obtenidos correctamente
                errors: []
                data:
                  - id: 439
                    claveActivo: AF00010
                    cb23: '100003'
                    tipo: Laptop
                    marca: Dell
                    modelo: Inspiron 15
                    numeroSerie: CXBF1Z3
                    sucursal: null
                    estado: EN_USO
                    estadoGeneral: null
                    nombreRed: null
                    responsable:
                      id: CT003
                      nombre: Ernesto Marquez Lopez
                      email: ernesto.marquez@horbismex.com
                meta:
                  page: 1
                  limit: 10
                  total: 214
                  totalPages: 22
        '400':
          description: Parametro invalido (page/limit malformados o enum de estado desconocido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: El parametro "estado" no tiene un valor valido
                errors:
                  - campo: estado
                    valor: BOGUS
                    permitidos:
                      - EN_USO
                      - EN_ALMACEN
                      - EN_MANTENIMIENTO
                      - DE_BAJA

    post:
      tags: [activos]
      summary: Crear un activo
      description: >
        Registra un activo nuevo. Solo "tipo" es obligatorio; si no se envia
        "estado" se usa EN_USO. Requiere permiso activos:crear.
      operationId: crearActivo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivoCreacion'
            example:
              tipo: Laptop
              claveActivo: AF00100
              marca: Lenovo
              modelo: ThinkPad E14
              numeroSerie: PF2XYZ99
              sucursal: CANCUN
              estado: EN_USO
              responsableId: A010
      responses:
        '201':
          description: Activo creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaActivo'
              example:
                success: true
                message: Activo creado correctamente
                errors: []
                data:
                  id: 215
                  claveActivo: AF00100
                  cb23: null
                  tipo: Laptop
                  marca: Lenovo
                  modelo: ThinkPad E14
                  numeroSerie: PF2XYZ99
                  sucursal: CANCUN
                  estado: EN_USO
                  estadoGeneral: null
                  nombreRed: null
                  responsable:
                    id: A010
                    nombre: Lauriano Antonio Cruz Durante
                    email: antonio.cruz@horbismex.com
                  numeroParte: null
                  anydesk: null
                  procesador: null
                  memoria: null
                  notas: null
                  asignaciones: []
        '400':
          description: >
            Datos invalidos: falta "tipo", "estado" no pertenece al enum o
            "responsableId" no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              examples:
                sinTipo:
                  summary: Falta el tipo
                  value:
                    success: false
                    message: Faltan campos obligatorios
                    errors:
                      - campo: tipo
                        valor: ''
                        mensaje: El tipo es obligatorio
                estadoInvalido:
                  summary: Estado fuera del enum
                  value:
                    success: false
                    message: El campo "estado" no tiene un valor valido
                    errors:
                      - campo: estado
                        valor: BOGUS
                        permitidos:
                          - EN_USO
                          - EN_ALMACEN
                          - EN_MANTENIMIENTO
                          - DE_BAJA
                responsableInexistente:
                  summary: Responsable inexistente
                  value:
                    success: false
                    message: El usuario responsable no existe
                    errors:
                      - campo: responsableId
                        valor: ZZZZ
                        mensaje: El usuario responsable no existe
        '409':
          description: Ya existe un activo con esa claveActivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: Ya existe un activo con esa clave
                errors:
                  - campo: claveActivo
                    valor: AF00010

  /api/activos/{id}:
    get:
      tags: [activos]
      summary: Obtener un activo por id
      description: Devuelve el activo con su responsable y las asignaciones activas. Requiere activos:leer.
      operationId: obtenerActivo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador numerico del activo
          schema:
            type: integer
            minimum: 1
            example: 439
      responses:
        '200':
          description: Activo obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaActivo'
        '400':
          description: El id no es un numero entero
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: El parametro "id" debe ser un numero entero
                errors:
                  - campo: id
                    valor: abc
        '404':
          description: No existe un activo con ese id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: Activo no encontrado
                errors:
                  - campo: id
                    valor: '999999'
    patch:
      tags: [activos]
      summary: Editar datos de un activo
      description: >
        Edicion parcial: solo los campos presentes en el body se modifican;
        un valor null o cadena vacia borra el dato. "estado" no se puede editar
        aqui (futuro PATCH /api/activos/{id}/estado) y "responsableId" acepta
        null para liberar el responsable. Requiere permiso activos:editar.
      operationId: actualizarActivo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            example: 439
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivoEdicion'
            example:
              marca: Lenovo
              modelo: ThinkPad E15
              notas: Reemplazo de teclado
              sucursal: CANCUN
      responses:
        '200':
          description: Activo actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaActivo'
              example:
                success: true
                message: Activo actualizado correctamente
                errors: []
                data:
                  id: 439
                  claveActivo: AF00010
                  cb23: '100003'
                  tipo: Laptop
                  marca: Lenovo
                  modelo: ThinkPad E15
                  numeroSerie: CXBF1Z3
                  sucursal: CANCUN
                  estado: EN_USO
                  estadoGeneral: null
                  nombreRed: null
                  responsable:
                    id: CT003
                    nombre: Ernesto Marquez Lopez
                    email: ernesto.marquez@horbismex.com
                  numeroParte: null
                  anydesk: null
                  procesador: null
                  memoria: null
                  notas: Reemplazo de teclado
                  asignaciones: []
        '400':
          description: >
            id no entero, estado presente en el body, tipo vacio, sin campos
            editables o responsableId inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              examples:
                idInvalido:
                  summary: id no numerico
                  value:
                    success: false
                    message: El parametro "id" debe ser un numero entero
                    errors:
                      - campo: id
                        valor: abc
                estadoNoEditable:
                  summary: estado no se edita aqui
                  value:
                    success: false
                    message: 'El campo "estado" no se puede editar aqui; use PATCH /api/activos/:id/estado'
                    errors:
                      - campo: estado
                        valor: EN_ALMACEN
                sinCampos:
                  summary: Body sin campos editables
                  value:
                    success: false
                    message: No se recibio ningun campo para actualizar
                    errors: []
                tipoVacio:
                  summary: tipo en null o cadena vacia
                  value:
                    success: false
                    message: Faltan campos obligatorios
                    errors:
                      - campo: tipo
                        valor: ''
                        mensaje: El tipo es obligatorio
                responsableInexistente:
                  summary: responsableId sin usuario
                  value:
                    success: false
                    message: El usuario responsable no existe
                    errors:
                      - campo: responsableId
                        valor: ZZZZ99
                        mensaje: El usuario responsable no existe
        '404':
          description: No existe un activo con ese id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: Activo no encontrado
                errors:
                  - campo: id
                    valor: '999999'
        '409':
          description: La nueva claveActivo ya pertenece a otro activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: Ya existe un activo con esa clave
                errors:
                  - campo: claveActivo
                    valor: AF00011
    delete:
      tags: [activos]
      summary: Dar de baja un activo (borrado logico -> estado DE_BAJA)
      description: >
        Nunca borra la fila. Marca el activo como DE_BAJA. Es idempotente: si
        ya estaba DE_BAJA responde 200 sin cambios. Falla con 409 si tiene una
        asignacion activa (devolver el equipo primero). Requiere activos:eliminar.
      operationId: eliminarActivo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Activo dado de baja correctamente (o ya estaba en baja)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaActivo'
              example:
                success: true
                message: Activo dado de baja correctamente
                errors: []
                data:
                  id: 660
                  claveActivo: AFDEV02
                  tipo: Dispositivo de prueba
                  estado: DE_BAJA
                  responsable: null
                  asignaciones: []
        '400':
          description: id no numerico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: El parametro "id" debe ser un numero entero
                errors:
                  - campo: id
                    valor: abc
        '404':
          description: No existe un activo con ese id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: Activo no encontrado
                errors:
                  - campo: id
                    valor: '999999'
        '409':
          description: El activo tiene una asignacion activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: El activo tiene una asignacion activa
                errors:
                  - campo: estado
                    valor: EN_USO
                  - campo: asignacionActiva
                    valor: '439'

  /api/activos/{id}/estado:
    patch:
      tags: [activos]
      summary: Cambiar el estado de un activo
      description: >
        Transiciones libres entre EN_USO, EN_ALMACEN, EN_MANTENIMIENTO y
        DE_BAJA. Si el activo tiene una asignacion activa no se permite pasar
        a DE_BAJA ni a EN_ALMACEN (409); primero debe devolverse. Enviar el
        mismo estado actual responde 200 sin modificar nada. Requiere permiso
        activos:estado.
      operationId: cambiarEstadoActivo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            example: 439
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstadoActivo'
            example:
              estado: EN_MANTENIMIENTO
      responses:
        '200':
          description: Estado actualizado (o sin cambios si era el mismo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaActivo'
              example:
                success: true
                message: Estado del activo actualizado correctamente
                errors: []
                data:
                  id: 439
                  claveActivo: AF00010
                  tipo: Laptop
                  estado: EN_MANTENIMIENTO
                  asignaciones: []
        '400':
          description: id no entero, falta "estado" o valor fuera del enum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              examples:
                idInvalido:
                  summary: id no numerico
                  value:
                    success: false
                    message: El parametro "id" debe ser un numero entero
                    errors:
                      - campo: id
                        valor: abc
                sinEstado:
                  summary: Body sin estado
                  value:
                    success: false
                    message: Faltan campos obligatorios
                    errors:
                      - campo: estado
                        valor: ''
                        mensaje: El estado es obligatorio
                estadoInvalido:
                  summary: Estado fuera del enum
                  value:
                    success: false
                    message: El campo "estado" no tiene un valor valido
                    errors:
                      - campo: estado
                        valor: BOGUS
                        permitidos:
                          - EN_USO
                          - EN_ALMACEN
                          - EN_MANTENIMIENTO
                          - DE_BAJA
        '404':
          description: No existe un activo con ese id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: Activo no encontrado
                errors:
                  - campo: id
                    valor: '999999'
        '409':
          description: Tiene asignacion activa y el nuevo estado exige devolucion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: El activo tiene una asignacion activa; devuelvelo antes de cambiar a DE_BAJA
                errors:
                  - campo: estado
                    valor: DE_BAJA
                  - campo: asignacionActiva
                    valor: '1'

  /api/activos/{id}/asignaciones:
    post:
      tags: [activos]
      summary: Asignar el activo a un usuario
      description: >
        Entrega el equipo a un usuario. En una sola transaccion: valida que el
        activo no este DE_BAJA, que el usuario exista y que no haya otra
        asignacion activa; crea o reactiva la asignacion del par
        (usuario, activo) y pone el activo en EN_USO con responsable = usuario.
        Si el usuario ya tuvo ese equipo (fila devuelta) la fila se reactiva.
        Requiere permiso activos:asignar.
      operationId: asignarActivo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            example: 439
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignacionActivoCreacion'
            example:
              usuarioId: A010
              anioCompra: 2024
              nombreEquipo: PC-CANCUN-01
              observacion: Entrega inicial
      responses:
        '201':
          description: Activo asignado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaActivo'
              example:
                success: true
                message: Activo asignado correctamente
                errors: []
                data:
                  id: 652
                  claveActivo: AFTEST1770000
                  tipo: Laptop
                  estado: EN_USO
                  responsable:
                    id: A010
                    nombre: Lauriano Antonio Cruz Durante
                    email: antonio.cruz@horbismex.com
                  asignaciones:
                    - id: 4
                      activa: true
                      fechaAsignacion: '2026-09-29T16:00:00.000Z'
                      usuario:
                        id: A010
                        nombre: Lauriano Antonio Cruz Durante
                        email: antonio.cruz@horbismex.com
        '400':
          description: id no entero, falta usuarioId, usuario inexistente o anioCompra no entero
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              examples:
                idInvalido:
                  summary: id no numerico
                  value:
                    success: false
                    message: El parametro "id" debe ser un numero entero
                    errors:
                      - campo: id
                        valor: abc
                sinUsuario:
                  summary: Body sin usuarioId
                  value:
                    success: false
                    message: Faltan campos obligatorios
                    errors:
                      - campo: usuarioId
                        valor: ''
                        mensaje: El usuario es obligatorio
                usuarioInexistente:
                  summary: usuarioId sin coincidencia
                  value:
                    success: false
                    message: El usuario no existe
                    errors:
                      - campo: usuarioId
                        valor: ZZZZ99
                        mensaje: El usuario no existe
                anioInvalido:
                  summary: anioCompra no entero
                  value:
                    success: false
                    message: El campo "anioCompra" debe ser un numero entero
                    errors:
                      - campo: anioCompra
                        valor: '2024.5'
        '404':
          description: No existe un activo con ese id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: Activo no encontrado
                errors:
                  - campo: id
                    valor: '999999'
        '409':
          description: Activo DE_BAJA o con asignacion activa (o carrera con otra asignacion)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              examples:
                asignacionActiva:
                  summary: Ya hay una asignacion activa
                  value:
                    success: false
                    message: El activo ya tiene una asignacion activa; devuelvelo antes de reasignarlo
                    errors:
                      - campo: activo
                        valor: '652'
                      - campo: asignacionActiva
                        valor: '4'
                dadoDeBaja:
                  summary: Activo dado de baja
                  value:
                    success: false
                    message: El activo esta dado de baja; no se puede asignar
                    errors:
                      - campo: estado
                        valor: DE_BAJA

