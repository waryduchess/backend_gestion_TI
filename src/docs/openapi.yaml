  /api/licencias:
    get:
      tags: [licencias]
      summary: Listar licencias con filtros
      description: >
        Requiere JWT y licencias:administrar. La clave nunca se devuelve;
        la respuesta solo indica tieneClave.
      operationId: listarLicencias
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: activa
          in: query
          description: Incluir licencias activas o inactivas
          schema:
            type: boolean
        - name: proveedor
          in: query
          schema:
            type: string
        - name: venceDesde
          in: query
          description: Fecha minima de vencimiento, formato YYYY-MM-DD
          schema:
            type: string
            format: date
        - name: venceHasta
          in: query
          description: Fecha maxima de vencimiento, formato YYYY-MM-DD
          schema:
            type: string
            format: date
        - name: q
          in: query
          description: Busca en software y proveedor
          schema:
            type: string
      responses:
        '200':
          description: Licencias obtenidas correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLicenciasPaginada'
        '400':
          description: Filtros o paginacion invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Token ausente, invalido o expirado
        '403':
          description: Requiere el permiso licencias:administrar
    post:
      tags: [licencias]
      summary: Registrar una licencia
      description: >
        La clave opcional se cifra con AES-256-GCM. La respuesta nunca la
        expone; solo informa tieneClave.
      operationId: crearLicencia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenciaRequest'
            example:
              software: Microsoft 365
              clave: "XXXXX-XXXXX-XXXXX"
              proveedor: Microsoft
              fechaCompra: '2026-01-01'
              fechaVencimiento: '2027-01-01'
              asignadaAId: ADMIN
      responses:
        '201':
          description: Licencia creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLicencia'
        '400':
          description: Datos invalidos o usuario asignado no existe/esta inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Token ausente, invalido o expirado
        '403':
          description: Requiere el permiso licencias:administrar
        '500':
          description: AES_SECRET_KEY invalida o error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /api/licencias/{id}:
    get:
      tags: [licencias]
      summary: Consultar licencia activa
      operationId: obtenerLicencia
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Licencia obtenida correctamente; no incluye su clave
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLicencia'
        '400':
          description: Identificador invalido
        '401':
          description: Token ausente, invalido o expirado
        '403':
          description: Requiere el permiso licencias:administrar
        '404':
          description: Licencia no encontrada o inactiva
    patch:
      tags: [licencias]
      summary: Editar o reasignar una licencia
      description: Enviar clave null para eliminar la clave cifrada; activa true reactiva una baja logica.
      operationId: actualizarLicencia
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenciaEdicion'
      responses:
        '200':
          description: Licencia actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLicencia'
        '400':
          description: Campos invalidos o usuario asignado no existe/esta inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Token ausente, invalido o expirado
        '403':
          description: Requiere el permiso licencias:administrar
        '404':
          description: Licencia no encontrada o inactiva
        '500':
          description: AES_SECRET_KEY invalida o error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
    delete:
      tags: [licencias]
      summary: Dar de baja una licencia
      description: Baja logica idempotente; no elimina filas ni claves cifradas.
      operationId: eliminarLicencia
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Licencia desactivada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLicencia'
        '400':
          description: Identificador invalido
        '401':
          description: Token ausente, invalido o expirado
        '403':
          description: Requiere el permiso licencias:administrar
        '404':
          description: Licencia no encontrada

  /api/usuarios:
    get:
      tags: [usuarios]
      summary: Listar usuarios (paginado y filtrable)
      description: Requiere el permiso usuarios:administrar.
      operationId: listarUsuarios
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Elementos por pagina (entre 1 y 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: q
          in: query
          required: false
          description: Busqueda libre en id, nombre y email
          schema:
            type: string
            example: Carmen
        - name: activo
          in: query
          required: false
          schema:
            type: string
            enum: ['true', 'false']
            example: 'true'
        - name: departamentoId
          in: query
          required: false
          schema:
            type: integer
            example: 1
        - name: ubicacionId
          in: query
          required: false
          schema:
            type: integer
            example: 2
        - name: puestoId
          in: query
          required: false
          schema:
            type: integer
            example: 3
        - name: tipoUsuarioId
          in: query
          required: false
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Usuarios obtenidos correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaUsuariosPaginada'
              example:
                success: true
                message: Usuarios obtenidos correctamente
                errors: []
                data:
                  - id: CT003
                    nombre: Carmen Torres Ruiz
                    email: null
                    activo: true
                    fechaInicio: null
                    fechaFin: null
                    departamento:
                      id: 1
                      nombre: Administracion
                    ubicacion: null
                    puesto: null
                    tipoUsuario: null
                    rol: null
                meta:
                  page: 1
                  limit: 10
                  total: 58
                  totalPages: 6
        '400':
          description: Parametros invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: El parametro "limit" debe estar entre 1 y 100
                errors:
                  - campo: limit
                    valor: '500'
        '401':
          description: Token ausente, invalido o expirado
        '403':
          description: Requiere el permiso usuarios:administrar
    post:
      tags: [usuarios]
      summary: Crear usuario
      description: >
        El password es opcional: sin el, el usuario queda sin acceso al
        sistema (passwordHash null). Si se envia, se guarda con bcrypt.
        Requiere el permiso usuarios:administrar.
      operationId: crearUsuario
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCreacion'
            example:
              id: ZZT01
              nombre: Usuario De Prueba
              email: prueba@horbismex.com
              password: Secreta123
              departamentoId: 1
      responses:
        '201':
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaUsuario'
              example:
                success: true
                message: Usuario creado correctamente
                errors: []
                data:
                  id: ZZT01
                  nombre: Usuario De Prueba
                  email: prueba@horbismex.com
                  activo: true
                  fechaInicio: null
                  fechaFin: null
                  departamento:
                    id: 1
                    nombre: Administracion
                  ubicacion: null
                  puesto: null
                  tipoUsuario: null
                  rol: null
        '400':
          description: Faltan campos obligatorios o catalogo inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              examples:
                sinNombre:
                  summary: nombre vacio
                  value:
                    success: false
                    message: Faltan campos obligatorios
                    errors:
                      - campo: nombre
                        valor: ''
                        mensaje: El nombre es obligatorio
                catalogoInexistente:
                  summary: departamentoId sin catalogo
                  value:
                    success: false
                    message: El catalogo de "departamentoId" no existe
                    errors:
                      - campo: departamentoId
                        valor: 999
                        mensaje: El catalogo indicado no existe
        '409':
          description: El id ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              example:
                success: false
                message: Ya existe un usuario con ese id
                errors:
                  - campo: id
                    valor: ADMIN
        '401':
          description: Token ausente, invalido o expirado
        '403':
          description: Requiere el permiso usuarios:administrar

